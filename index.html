<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="color-scheme" content="dark">
<title>Nocturne Mobile · Tienda de celulares</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fraunces:ital,wght@0,400;0,700;1,400&family=Inter:wght@400;500;600&display=swap">
<style>
:root{--bg:#09050f;--bg2:#140a22;--card:#1a0f2b;--line:#ffffff1a;--tx:#f5eefc;--mut:#a99bbd;--or:#ff7a1a;--or2:#ffb347;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
*{box-sizing:border-box;margin:0}
html{scroll-behavior:smooth}
body{background:var(--bg);color:var(--tx);font:16px/1.6 Inter,system-ui,sans-serif;overflow-x:hidden}
h1,h2,h3{font-family:Fraunces,Georgia,serif;line-height:1.08}
a{color:inherit;text-decoration:none}
.wrap{max-width:1180px;margin:0 auto;padding:0 22px}
header.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:#09050fe6;backdrop-filter:blur(14px);border-bottom:1px solid var(--line)}
.bar{display:flex;align-items:center;justify-content:space-between;height:62px}
.logo{font-family:Fraunces,serif;font-weight:700;font-size:22px}.logo b{color:var(--or)}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;background:linear-gradient(135deg,var(--or),#ff4d1a);color:#1a0800;font-weight:600;padding:11px 22px;border-radius:99px;border:0;cursor:pointer;font-size:14px;box-shadow:0 8px 30px #ff7a1a40;transition:transform .25s}
.btn:hover{transform:translateY(-2px)}
.btn.ghost{background:none;color:var(--tx);border:1px solid var(--line);box-shadow:none}
.chips{display:flex;gap:8px;overflow-x:auto;padding:0 22px 12px;max-width:1180px;margin:0 auto;scrollbar-width:none}
.chip{flex:none;border:1px solid var(--line);color:var(--mut);padding:7px 16px;border-radius:99px;font-size:14px;white-space:nowrap}
.chip.on{background:var(--or);border-color:var(--or);color:#1a0800;font-weight:600}
.hero{position:relative;padding:64px 0 76px;overflow:hidden;background:radial-gradient(800px 420px at 80% 30%,#8b3dff40,transparent 60%),radial-gradient(600px 350px at 8% 95%,#ff7a1a26,transparent 60%)}
.hero .wrap{display:grid;grid-template-columns:1.15fr .85fr;gap:30px;align-items:center}
.pill{display:inline-block;border:1px solid #ff7a1a66;color:var(--or2);padding:6px 16px;border-radius:99px;font-size:13px;margin-bottom:20px;background:#ff7a1a14}
h1{font-size:clamp(38px,6.5vw,76px);letter-spacing:-.02em}h1 em{color:var(--or);font-weight:400}
.hero p{color:var(--mut);max-width:470px;margin:18px 0 28px;font-size:18px}
.stage{position:relative;height:330px;display:grid;place-items:center}
.moon{position:absolute;width:260px;height:260px;border-radius:50%;background:radial-gradient(circle at 35% 35%,#ffd9a0,#ff7a1a 55%,#8b3dff00 72%);animation:pulse 6s ease-in-out infinite}
.hp{position:relative;width:150px;height:300px;border-radius:30px;background:linear-gradient(160deg,#2b1d45,#0d0716);border:2px solid #ffffff30;box-shadow:0 30px 70px #000a,0 0 70px #8b3dff55;transform:rotate(-8deg);animation:float 5s ease-in-out infinite}
.hp::before{content:"";position:absolute;inset:8px;border-radius:23px;background:radial-gradient(circle at 50% 40%,#ff7a1a,#7a2bd4 70%,#1a0b30)}
.hp::after{content:"🎃";position:absolute;inset:0;display:grid;place-items:center;font-size:64px;filter:drop-shadow(0 0 20px #ff7a1a)}
.bat{position:absolute;top:15%;font-size:24px;animation:fly 14s linear infinite;opacity:.8}.bat+.bat{top:65%;animation-delay:-7s}
.ember{position:absolute;bottom:-10px;width:4px;height:4px;border-radius:50%;background:var(--or2);box-shadow:0 0 10px var(--or);animation:rise 9s linear infinite;opacity:0}
@keyframes float{50%{transform:rotate(-5deg) translateY(-14px)}}
@keyframes pulse{50%{transform:scale(1.07)}}
@keyframes fly{from{left:-50px}to{left:105%}}
@keyframes rise{10%{opacity:.9}to{transform:translateY(-520px) translateX(40px);opacity:0}}
section{padding:64px 0}
.head{display:flex;justify-content:space-between;align-items:end;gap:16px;flex-wrap:wrap;margin-bottom:30px}
h2{font-size:clamp(30px,4.5vw,48px)}.head p,.crumb{color:var(--mut)}
.tiles{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:18px}
.tile{display:block;border:1px solid var(--line);border-radius:24px;padding:26px;background:linear-gradient(160deg,var(--card),#10081c);transition:transform .35s,border-color .35s,box-shadow .35s}
.tile:hover{transform:translateY(-6px);border-color:#ff7a1a80;box-shadow:0 20px 50px #8b3dff30}
.tile .e{font-size:46px;display:block;margin-bottom:14px;filter:drop-shadow(0 0 18px #ff7a1a88)}
.tile h3{font-size:22px}.tile small{color:var(--mut)}.tile span.n{float:right;color:var(--or2);font-size:13px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(240px,1fr));gap:18px}
.card{position:relative;background:linear-gradient(180deg,var(--card),#10081c);border:1px solid var(--line);border-radius:22px;padding:18px;display:flex;flex-direction:column;transition:transform .35s,border-color .35s,box-shadow .35s}
.card:hover{transform:translateY(-7px);border-color:#ff7a1a80;box-shadow:0 22px 55px #8b3dff30}
.tag{position:absolute;top:14px;left:14px;z-index:2;background:var(--or);color:#1a0800;font-size:11px;font-weight:700;padding:4px 11px;border-radius:99px}
.art{height:190px;border-radius:14px;display:grid;place-items:center;background:radial-gradient(circle at 50% 60%,var(--g1),transparent 70%),#0d0716;margin-bottom:16px}
.ph{width:84px;height:158px;border-radius:20px;background:linear-gradient(150deg,var(--c1),var(--c2));border:2px solid #ffffff40;position:relative;box-shadow:0 16px 36px #0009;transition:transform .5s}
.card:hover .ph{transform:rotate(-6deg) scale(1.06)}
.ph i{position:absolute;top:9px;left:9px;width:30px;height:30px;border-radius:10px;background:#0008;box-shadow:inset 0 0 0 2px #fff3}
.ic{font-size:64px;filter:drop-shadow(0 0 20px var(--c1))}
.card h3{font-size:20px;margin-bottom:4px}.card small{color:var(--mut);font-size:13px;flex:1}
.wa{margin-top:14px;width:100%}
.search{background:#ffffff0d;border:1px solid var(--line);color:var(--tx);padding:11px 18px;border-radius:99px;font:inherit;font-size:14px;min-width:230px;outline:none}
.search:focus{border-color:var(--or)}
.empty{color:var(--mut);padding:40px 0}
.three{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:18px}
.box{border:1px solid var(--line);border-radius:22px;padding:26px;background:#ffffff06}.box b{font-size:32px}.box h3{font-size:20px;margin:10px 0 6px}.box p{color:var(--mut);font-size:15px}
.final{text-align:center;padding:80px 0;background:radial-gradient(600px 280px at 50% 100%,#ff7a1a30,transparent 70%)}
.final p{color:var(--mut);margin:14px auto 26px;max-width:440px}
footer{border-top:1px solid var(--line);padding:26px 0;color:var(--mut);font-size:13px;text-align:center}
.fab{position:fixed;right:18px;bottom:calc(18px + env(safe-area-inset-bottom,0px));z-index:30;width:58px;height:58px;border-radius:50%;background:#25d366;display:grid;place-items:center;font-size:28px;box-shadow:0 10px 30px #25d36666}
@media(max-width:820px){.hero{padding:36px 0 50px}.hero .wrap{grid-template-columns:1fr}.stage{height:270px;order:-1}.hp{width:120px;height:240px}.moon{width:200px;height:200px}section{padding:44px 0}}
.feat{position:relative;display:grid;grid-template-columns:1fr 1fr;gap:40px;align-items:center;border:1px solid var(--line);border-radius:32px;padding:28px;background:linear-gradient(160deg,var(--card),#10081c);overflow:hidden}
.feat::before{content:"";position:absolute;width:420px;height:420px;right:-80px;top:-120px;background:radial-gradient(circle,#ff7a1a40,transparent 65%)}
.fimg{position:relative}.fimg img{width:100%;display:block;border-radius:22px;box-shadow:0 30px 80px #ff7a1a30}
.ftxt{position:relative}.ftxt h2{margin:6px 0 12px}.ftxt p{color:var(--mut);margin-bottom:20px}
.dots{display:flex;gap:10px;margin-bottom:24px;align-items:center;color:var(--mut);font-size:14px}.dots i{width:18px;height:18px;border-radius:50%;border:2px solid #fff4}
.fb{display:flex;gap:12px;flex-wrap:wrap}
@media(max-width:820px){.feat{grid-template-columns:1fr;padding:18px;gap:22px}}
.wi{width:1.25em;height:1.25em;fill:currentColor;flex:none}.fab .wi{width:32px;height:32px;fill:#fff}.g .wi{width:34px;height:34px;fill:#25d366}
.pimg{height:170px;width:auto;max-width:92%;object-fit:contain;filter:drop-shadow(0 18px 30px #000c);transition:transform .5s}.card:hover .pimg{transform:scale(1.07) rotate(-2deg)}
.pr{margin-top:12px;line-height:1.2}.pr b{font-size:23px;font-family:Fraunces,Georgia,serif}.pr s{color:var(--mut);font-size:13px;margin-left:8px}.pr .from{color:var(--mut);font-size:12px;margin-right:4px}.pr em{display:block;font-style:normal;color:var(--or2);font-size:12px;margin-top:3px}
.card{cursor:pointer}
.mo{position:fixed;inset:0;z-index:50;background:#05020ad9;backdrop-filter:blur(10px);display:flex;align-items:center;justify-content:center;padding:20px;animation:fi .25s}
.mo[hidden]{display:none}
.md{position:relative;width:min(920px,100%);max-height:calc(100dvh - 40px);overflow:auto;background:linear-gradient(160deg,#1d1033,#0f0819);border:1px solid #ff7a1a55;border-radius:28px;box-shadow:0 40px 120px #000,0 0 80px #8b3dff33;animation:pop .35s cubic-bezier(.2,.9,.3,1.2)}
@keyframes fi{from{opacity:0}}@keyframes pop{from{opacity:0;transform:translateY(24px) scale(.96)}}
.x{position:absolute;top:14px;right:14px;z-index:3;width:40px;height:40px;border-radius:50%;border:1px solid var(--line);background:#ffffff14;color:var(--tx);font-size:18px;cursor:pointer}
.x:hover{background:var(--or);color:#1a0800}
.mg{display:grid;grid-template-columns:1fr 1.1fr}
.mart{display:grid;place-items:center;min-height:400px;background:radial-gradient(circle at 50% 55%,var(--g1),transparent 68%),#0d0716;border-radius:28px 0 0 28px}
.mart .ph{width:120px;height:226px;border-radius:28px}.mart .ph i{width:42px;height:42px;border-radius:14px}.mart .pimg{height:300px}.mart .ic{font-size:110px}
.minf{padding:34px 30px}.minf h2{font-size:clamp(28px,4vw,40px);margin:6px 0 12px}
.mp b{font-size:32px;font-family:Fraunces,Georgia,serif}.mp s{color:var(--mut);margin-left:8px}.mp .from{color:var(--mut);font-size:13px;margin-right:6px}.off{background:var(--or);color:#1a0800;font-size:12px;font-weight:700;padding:3px 10px;border-radius:99px;margin-left:8px}
.mp em{display:block;font-style:normal;color:var(--or2);font-size:13px;margin-top:4px}
.md .desc{color:var(--mut);margin:14px 0 4px}
.sp{margin:16px 0;border-top:1px solid var(--line)}.sp div{display:flex;justify-content:space-between;gap:14px;padding:10px 0;border-bottom:1px solid var(--line);font-size:14px}.sp span{color:var(--mut)}.sp b{font-weight:600;text-align:right}
.sp .ck{justify-content:flex-start;gap:10px}.sp .ck::before{content:"✓";color:var(--or)}
.tr{display:flex;gap:8px 18px;flex-wrap:wrap;color:var(--mut);font-size:13px;margin:6px 0 22px}
.mb{display:flex;gap:12px;flex-wrap:wrap}.mb .btn{flex:1;min-width:170px}.note{color:var(--mut);font-size:12px;margin-top:14px}
@media(max-width:760px){.mo{align-items:flex-end;padding:0}.md{max-height:92dvh;border-radius:26px 26px 0 0;width:100%}.mg{grid-template-columns:1fr}.mart{border-radius:26px 26px 0 0;min-height:250px}.mart .pimg{height:200px}.minf{padding:22px 20px 30px}}
</style>
</head>

function card(p){

function list(id,q){
q=(q||"").toLowerCase();
var r=P.filter(function(p){return p[0]===id&&(p[1]+" "+p[5]).toLowerCase().indexOf(q)>-1});
return r.length?r.map(card).join(""):'<p class="empty">No encontramos productos con esa búsqueda. Escríbenos por WhatsApp y los conseguimos.</p>';
}
function page(id){
var c=cat(id);if(!c)return home();
return '<section><div class="wrap"><p class="crumb"><a href="#/">Inicio</a> / '+esc(c[1])+'</p><div class="head"><div><h2>'+c[2]+' '+esc(c[1])+'</h2><p>'+count(id)+' productos · precios por WhatsApp</p></div><input class="search" id="q" placeholder="Buscar en '+esc(c[1])+'…"></div><div class="grid" id="lst">'+list(id)+'</div></div></section>';
}
function wire(){
document.querySelectorAll("[data-wa]").forEach(function(a){a.href=wa(a.dataset.wa);a.target="_blank";a.rel="noopener"});
var e=document.getElementById("embers");
if(e){var s="";for(var i=0;i<16;i++)s+='<i class="ember" style="left:'+(Math.random()*100)+'%;animation-delay:'+(-Math.random()*9)+'s;animation-duration:'+(6+Math.random()*7)+'s"></i>';e.style.cssText="position:absolute;inset:0;pointer-events:none";e.innerHTML=s}
}
function route(){
try{

}catch(err){console.error(err)}

function closeM(){var m=document.getElementById("mo");if(m.hidden)return;m.hidden=true;document.body.style.overflow="";if(lastF&&lastF.focus)lastF.focus()}

});
